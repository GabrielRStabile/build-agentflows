x-app-environment: &app-environment
  NODE_ENV: production
  DATA_DIR: /app/data
  APP_URL: ${APP_URL:?Informe a URL publica HTTPS}
  CHAVE_MESTRA: ${CHAVE_MESTRA:?Informe 32 bytes em base64}
  DATABASE_URL: postgresql://agentflows:${POSTGRES_PASSWORD:?Informe senha base64url}@postgres:5432/agentflows
  REDIS_URL: redis://:${REDIS_PASSWORD:?Informe senha base64url}@redis:6379
  RESEND_API_KEY: ${RESEND_API_KEY:?Configure o Resend}
  RESEND_FROM: ${RESEND_FROM:?Configure o remetente verificado}
  RESEND_ENVIOS_POR_SEGUNDO: ${RESEND_ENVIOS_POR_SEGUNDO:-2}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  FILA_LIMITE_USUARIO: ${FILA_LIMITE_USUARIO:-100}
  FILA_LIMITE_TOTAL: ${FILA_LIMITE_TOTAL:-2000}
  EXECUCOES_SIMULTANEAS: ${EXECUCOES_SIMULTANEAS:-6}
  LIMITE_EXECUCAO_SEGUNDOS: ${LIMITE_EXECUCAO_SEGUNDOS:-180}
  POSTGRES_CONEXOES: ${POSTGRES_CONEXOES:-10}
  LIMITE_EXECUCOES_MES: ${LIMITE_EXECUCOES_MES:-1000}
  LIMITE_FLUXOS: ${LIMITE_FLUXOS:-5}
  LIMITE_ARMAZENAMENTO_MB: ${LIMITE_ARMAZENAMENTO_MB:-50}
  # Credencial OpenAI oferecida às contas que entram por convite (DEPLOY-COOLIFY.md, "Credencial compartilhada").
  OPENAI_CHAVE_COMPARTILHADA: ${OPENAI_CHAVE_COMPARTILHADA:-}
  OPENAI_CHAVE_COMPARTILHADA_NOME: ${OPENAI_CHAVE_COMPARTILHADA_NOME:-StartSe OpenAI API}
  OPENAI_CHAVE_COMPARTILHADA_NOME_EMBEDDINGS: ${OPENAI_CHAVE_COMPARTILHADA_NOME_EMBEDDINGS:-StartSe OpenAI Embedding API}
  OPENAI_CHAVE_COMPARTILHADA_HORAS: ${OPENAI_CHAVE_COMPARTILHADA_HORAS:-72}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    expose:
      - "10000"
    environment:
      <<: *app-environment
      PORT: "10000"
      HOSTNAME: 0.0.0.0
    volumes:
      - dados:/app/data
    tmpfs:
      - /tmp:size=268435456,mode=1777,nosuid,nodev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Perfil de turma grande: veja "Prática com 150 pessoas" em DEPLOY-COOLIFY.md.
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    cpus: ${APP_CPUS:-1.5}
    pids_limit: 256
    stop_grace_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "--import", "./scripts/gancho-ts.mjs", "scripts/worker.mjs"]
    init: true
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - dados:/app/data
    tmpfs:
      - /tmp:size=268435456,mode=1777,nosuid,nodev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--import", "./scripts/gancho-ts.mjs", "scripts/worker-health.mjs"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Cada execução ChatGPT abre um lançador Node (~8 threads) e o binário Codex (~30 threads):
    # cerca de 40 PIDs e 100 a 200 MB por vaga. Dimensione os três limites junto com EXECUCOES_SIMULTANEAS
    # e mantenha stop_grace_period acima de LIMITE_EXECUCAO_SEGUNDOS + 15 s.
    mem_limit: ${WORKER_MEM_LIMIT:-2048m}
    cpus: ${WORKER_CPUS:-2}
    pids_limit: ${WORKER_PIDS_LIMIT:-512}
    stop_grace_period: ${WORKER_STOP_GRACE:-210s}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentflows
      POSTGRES_DB: agentflows
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Informe senha base64url}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    # Publica o PostgreSQL no host do Coolify (POSTGRES_PORTA_HOST, padrão 5437) para
    # administração e backup; proteja a porta no firewall ou acesse por túnel SSH.
    ports: ["${POSTGRES_PORTA_HOST:-5437}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflows -d agentflows"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    cpus: ${POSTGRES_CPUS:-1}
    stop_grace_period: 60s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Informe senha base64url}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-dados:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 192m
    cpus: 0.5
    stop_grace_period: 30s
volumes:
  dados:
  postgres-dados:
  redis-dados:
